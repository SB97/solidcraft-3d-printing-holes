# Builds the plugin zip and attaches it to a GitHub release when a tag v* is pushed.
# The SolidCraft plugin list (tharje.github.io/solidcraft-plugins) links the zip of the latest release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # The runner has other MinGW gcc builds on PATH, which the GNU toolchain of
      # rust-toolchain.toml would link with; MSVC is installed there, so use it.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --target wasm32-unknown-unknown

      - name: Tag matches manifest version
        shell: pwsh
        run: |
          $v = (Get-Content plugin/plugin.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME != plugin.json version $v" }

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Test
        shell: pwsh
        run: |
          $out = cargo test 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $tail = ($out -split "`r?`n" | Select-Object -Last 40) -join '%0A'
            Write-Output "::error title=cargo test failed::$tail"
            exit $code
          }

      - name: Build
        shell: powershell
        run: .\scripts\build.ps1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/solidcraft-3d-printing-holes.zip
          generate_release_notes: true
