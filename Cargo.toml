[package]
name = "solidcraft-3d-printing-holes"
version = "0.2.0"
edition = "2021"
description = "SolidCraft plugin: 3D-print friendly holes (teardrop, ...)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.57"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
